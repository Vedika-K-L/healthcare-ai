<!doctype html>
<html lang="en">
<head>

<title>Anatomical human heart</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090611;color:#fff;font-family:system-ui,sans-serif}
.stage{position:relative;display:grid;place-items:center;width:100%;height:100%;min-height:300px;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#24101f 0%,#110b19 57%,#090611 100%)}
.stage:before,.stage:after{position:absolute;content:"";width:64%;aspect-ratio:1;border:1px solid rgba(255,140,157,.08);border-radius:50%;pointer-events:none}.stage:after{width:82%;border-color:rgba(255,140,157,.045)}
.stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe8e8;box-shadow:0 0 9px 2px rgba(255,126,151,.58);opacity:.48;animation:twinkle 3.8s ease-in-out infinite alternate}
.star:nth-child(1){left:14%;top:20%;animation-delay:.3s}.star:nth-child(2){left:81%;top:18%;animation-delay:1.7s}.star:nth-child(3){left:22%;top:73%;animation-delay:2.2s}.star:nth-child(4){left:88%;top:64%;animation-delay:.9s}.star:nth-child(5){left:68%;top:11%;animation-delay:2.8s}.star:nth-child(6){left:9%;top:53%;animation-delay:1.2s}
svg{position:relative;z-index:1;display:block;width:min(94%,390px);max-height:94%;overflow:visible;filter:drop-shadow(0 0 28px rgba(255,45,75,.3))}.beat{transform-box:fill-box;transform-origin:center;animation:heartbeat 2.4s ease-in-out infinite}.heart-outline{fill:none;stroke:rgba(255,214,207,.55);stroke-width:2;vector-effect:non-scaling-stroke}
.caption{position:absolute;bottom:13px;z-index:2;color:rgba(255,224,225,.62);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
@keyframes heartbeat{0%,100%{transform:scale(1)}8%{transform:scale(1.035)}16%{transform:scale(1)}24%{transform:scale(1.02)}36%{transform:scale(1)}}@keyframes twinkle{from{transform:scale(.7);opacity:.22}to{transform:scale(1.25);opacity:.92}}
@media(max-width:520px){.stage{min-height:270px}svg{width:min(100%,340px)}.caption{bottom:9px;font-size:8px}}@media(prefers-reduced-motion:reduce){.beat,.star{animation:none!important}.beat{transform:none}}
</style></head>
